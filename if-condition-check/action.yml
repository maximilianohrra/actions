name: "If condition check"
description: "verify if-condition behavior for the sign-release-files PR."
inputs:
  gpg-key:
    description: "Dummy GPG key value."
    default: ""
  gpg-fingerprint:
    description: "Dummy GPG fingerprint value."
    default: ""
  gpg-passphrase:
    description: "Dummy GPG passphrase value."
    default: ""
runs:
  using: "composite"
  steps:
    - name: current (with broken syntax) #this is the current syntax in the sign-release-files action.yml.
      if: ${{ inputs.sign-release-files == 'true' }} && ${{ inputs.gpg-key }} && ${{ inputs.gpg-fingerprint }} && ${{ inputs.gpg-passphrase }}
      run: |
        echo "current (with broken syntax): step ran"
      shell: bash
    - name: syntax fixed, same operands
      if: inputs.sign-release-files == 'true' && inputs.gpg-key && inputs.gpg-fingerprint && inputs.gpg-passphrase
      run: |
        echo "syntax fixed — without the curly braces: step ran, but inputs.sign-release-files is not set, so this step is actually skipped"
      shell: bash
    - name: proposed — without if statement, this PR.
      run: |
        echo "proposed (no if, this PR): step ran"
      shell: bash
